<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Community Service Hour Tracker</title>
  <link rel="manifest" href="manifest.json">
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 512 512'><circle cx='256' cy='256' r='210' fill='%23080d1a' stroke='%23121e36' stroke-width='20'/><line x1='256' y1='256' x2='256' y2='135' stroke='%23ffffff' stroke-width='18' stroke-linecap='square'/><line x1='256' y1='256' x2='345' y2='256' stroke='%23ffffff' stroke-width='14' stroke-linecap='square'/><circle cx='256' cy='256' r='16' fill='%23ffffff'/></svg>">
  <meta name="theme-color" content="#000000">
  <style>
    :root {
      --bg: #000000;
      --panel: #080d1a;
      --line: #121e36;
      --fg: #ffffff;
      --muted: #8fa3c0;
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html { -webkit-text-size-adjust: 100%; }
    body {
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background: var(--bg);
      color: var(--fg);
      min-height: 100vh;
      -webkit-tap-highlight-color: transparent;
    }
    button { font: inherit; cursor: pointer; }
    input, select, textarea { font: inherit; }
    svg { flex: 0 0 auto; }

    .wrap { max-width: 720px; margin: 0 auto; padding: 0 16px 64px; }

    .navbar {
      display: flex; align-items: stretch; width: 100%;
      height: 56px; border-bottom: 1px solid var(--line);
    }
    .navbar.hidden { display: none; }
    .navbar button {
      background: transparent; color: var(--muted); border: none;
      display: flex; align-items: center; justify-content: center; gap: 8px;
      font-weight: 600; font-size: 12px; letter-spacing: .08em; text-transform: uppercase;
      padding: 0 14px; flex: 1; transition: background .15s, color .15s;
    }
    .navbar button + button { border-left: 1px solid var(--line); }
    .navbar button:hover { color: var(--fg); background: var(--panel); }
    .navbar button.active { color: var(--fg); background: var(--panel); }
    #openDataOverlayBtn { flex: 0 0 auto; border-left: 1px solid var(--line); }

    .databar {
      display: none; align-items: stretch; width: 100%;
      height: 56px; background: var(--panel); border-bottom: 1px solid var(--line);
    }
    .databar.open { display: flex; }
    .databar button {
      background: transparent; color: var(--fg); border: none; flex: 1;
      display: flex; align-items: center; justify-content: center; gap: 6px;
      font-weight: 600; font-size: 11px; letter-spacing: .08em; text-transform: uppercase;
      padding: 0 10px; transition: background .15s;
    }
    .databar button + button { border-left: 1px solid var(--line); }
    .databar button:hover { background: var(--line); }
    .databar #closeDataOverlayBtn { flex: 0 0 auto; }

    .field {
      background: var(--panel); border: 1px solid var(--line); color: var(--fg);
      border-radius: 0; width: 100%; padding: 14px; display: block;
    }
    .field:focus { border-color: var(--fg); outline: none; }
    .field::placeholder { color: var(--muted); }
    ::-webkit-calendar-picker-indicator { filter: invert(1); }
    label.lbl {
      display: block; font-size: 10px; font-weight: 700; letter-spacing: .12em;
      text-transform: uppercase; color: var(--muted); margin: 0 0 6px;
    }

    .btn {
      border: 1px solid var(--fg); background: var(--line); color: var(--fg);
      font-weight: 700; letter-spacing: .1em; text-transform: uppercase;
      padding: 14px 18px; transition: background .15s;
    }
    .btn:hover { background: #1a2b50; }
    .btn.ghost { background: var(--bg); }
    .btn.ghost:hover { background: var(--panel); }
    .btn.small { padding: 6px 12px; font-size: 11px; }

    section.tab { display: none; padding-top: 24px; }
    section.tab.active { display: block; }

    .status-pill {
      display: inline-block; font-size: 10px; font-weight: 700; letter-spacing: .15em;
      text-transform: uppercase; color: var(--muted); border: 1px solid var(--line);
      padding: 5px 12px;
    }
    .status-pill.running { color: var(--fg); }
    .timer-display {
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Courier New", monospace;
      font-variant-numeric: tabular-nums lining-nums;
      letter-spacing: .1em;
      font-size: clamp(48px, 14vw, 84px); font-weight: 800; line-height: 1.1;
      margin: 20px 0 28px;
    }
    .stack > * + * { margin-top: 14px; }
    .row { display: flex; gap: 14px; }
    .row > * { flex: 1; }
    @media (max-width: 520px) { .row { flex-direction: column; } .row > * { flex: none; } }

    .history-head { display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
    .total-hours { font-size: 28px; font-weight: 800; }
    .total-hours .mono {
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Courier New", monospace;
      font-variant-numeric: tabular-nums lining-nums; letter-spacing: .05em;
    }
    .total-hours small { display: block; font-size: 10px; font-weight: 700; letter-spacing: .12em; text-transform: uppercase; color: var(--muted); }
    .toolbar { display: flex; gap: 14px; margin-top: 20px; }
    .toolbar select { flex: 0 0 auto; width: auto; padding: 10px; }
    .toolbar input { flex: 1; padding: 10px; }
    @media (max-width: 520px) { .toolbar { flex-direction: column; } .toolbar select, .toolbar input { width: 100%; } }

    .log-card {
      border: 1px solid var(--line); background: var(--panel); padding: 16px;
      display: flex; justify-content: space-between; gap: 14px; align-items: flex-start;
    }
    .log-card .meta { font-size: 12px; color: var(--muted); margin-top: 4px; }
    .log-card .meta span + span::before { content: " • "; }
    .log-card .notes { font-size: 12px; color: var(--muted); margin-top: 6px; }
    .log-card .actions { display: flex; gap: 8px; flex: 0 0 auto; }
    .log-card h3 { font-size: 16px; font-weight: 700; overflow-wrap: anywhere; }
    .hrs-badge {
      display: inline-block; margin-top: 8px; font-size: 11px; font-weight: 700;
      letter-spacing: .08em; border: 1px solid var(--line); padding: 3px 8px; color: var(--fg);
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Courier New", monospace;
      font-variant-numeric: tabular-nums lining-nums;
    }
    #historyList { margin-top: 20px; }
    .empty {
      border: 1px solid var(--line); background: var(--panel); color: var(--muted);
      padding: 32px; text-align: center; font-size: 13px;
    }

    .modal-backdrop {
      position: fixed; inset: 0; z-index: 50; display: none;
      align-items: center; justify-content: center;
      background: rgba(0,0,0,.85); padding: 16px;
    }
    .modal-backdrop.open { display: flex; }
    .modal {
      background: var(--bg); border: 1px solid var(--line); width: 100%; max-width: 480px;
      max-height: 90vh; overflow-y: auto; padding: 24px;
    }
    .modal-head { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; }
    .modal-head h2 { font-size: 14px; font-weight: 700; letter-spacing: .1em; text-transform: uppercase; }
    .modal-close { background: none; border: none; color: var(--muted); font-size: 22px; line-height: 1; }
    .modal-close:hover { color: var(--fg); }

    #toast {
      position: fixed; left: 50%; bottom: 24px; transform: translateX(-50%) translateY(20px);
      background: var(--panel); border: 1px solid var(--line); color: var(--fg);
      padding: 12px 20px; font-size: 13px; opacity: 0; pointer-events: none;
      transition: opacity .25s, transform .25s; z-index: 60; max-width: 90vw; text-align: center;
    }
    #toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

    .hint { font-size: 11px; color: var(--muted); margin-top: 10px; }
  </style>
</head>
<body>

  <header>
    <nav class="navbar" id="mainNavBar" role="navigation" aria-label="Main">
      <button id="navLive" onclick="switchTab('live')" class="active" aria-label="Live tracker"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="square" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 3"/></svg><span>Live</span></button>
      <button id="navHistory" onclick="switchTab('history')" aria-label="Service history"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="square" aria-hidden="true"><path d="M8 6h13M8 12h13M8 18h13M3 6h.01M3 12h.01M3 18h.01"/></svg><span>History</span></button>
      <button id="navManual" onclick="switchTab('manual')" aria-label="Log past hours"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="square" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M12 8v8M8 12h8"/></svg><span>Log Hours</span></button>
      <button id="openDataOverlayBtn" onclick="toggleDataOverlay(true)" title="Data management" aria-label="Data menu"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="square" aria-hidden="true"><ellipse cx="12" cy="5" rx="8" ry="3"/><path d="M4 5v14c0 1.7 3.6 3 8 3s8-1.3 8-3V5"/><path d="M4 12c0 1.7 3.6 3 8 3s8-1.3 8-3"/></svg><span>Data</span></button>
    </nav>
    <div class="databar" id="dataOverlayBar" role="toolbar" aria-label="Data management">
      <button onclick="directExportMarkdown()"><svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="square" aria-hidden="true"><path d="M12 3v12m0 0l-4-4m4 4l4-4M4 21h16"/></svg><span>Resume .md</span></button>
      <button onclick="directExportCSV()"><svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="square" aria-hidden="true"><rect x="3" y="3" width="18" height="18"/><path d="M3 9h18M3 15h18M9 3v18M15 3v18"/></svg><span>CSV</span></button>
      <button onclick="directExportJSON()"><svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="square" aria-hidden="true"><path d="M3 8h18v11a2 2 0 01-2 2H5a2 2 0 01-2-2V8zM2 4h20v4H2zM10 12h4"/></svg><span>Backup .json</span></button>
      <button onclick="triggerImportFileDialog()"><svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="square" aria-hidden="true"><path d="M12 21V9m0 0l-4 4m4-4l4 4M4 3h16"/></svg><span>Import</span></button>
      <button id="closeDataOverlayBtn" onclick="toggleDataOverlay(false)" title="Close data menu" aria-label="Close data menu">&#10005;</button>
    </div>
  </header>

  <main class="wrap">

    <section id="tabLive" class="tab active" aria-label="Live timer">
      <div style="text-align:center;">
        <span id="timerStatus" class="status-pill">Ready to start</span>
        <div id="timerDisplay" class="timer-display" role="timer" aria-live="off">00:00:00</div>
      </div>
      <div class="stack">
        <div>
          <label class="lbl" for="liveActivity">Activity</label>
          <input type="text" id="liveActivity" list="activitySuggestions" placeholder="Activity name" class="field" autocomplete="off">
        </div>
        <div>
          <label class="lbl" for="liveNotes">Notes</label>
          <textarea id="liveNotes" rows="3" placeholder="Additional details..." class="field"></textarea>
        </div>
        <div class="row">
          <button id="startTimerBtn" onclick="toggleTimer()" class="btn">Start session</button>
          <button id="resetTimerBtn" onclick="resetTimer()" class="btn ghost">Reset</button>
        </div>
      </div>
      <p class="hint">The timer keeps running even if you close the page &mdash; it restores automatically when you come back.</p>
    </section>

    <section id="tabHistory" class="tab" aria-label="Service history">
      <div class="history-head">
        <div class="total-hours"><span id="totalHoursDisplay" class="mono">0:00:00</span><small id="totalHoursSub">0 sessions</small></div>
      </div>
      <div class="toolbar">
        <select id="sortOrder" onchange="renderHistory()" class="field" aria-label="Sort order">
          <option value="date-desc">Date &darr; Newest first</option>
          <option value="date-asc">Date &uarr; Oldest first</option>
          <option value="duration-desc">Duration &darr; Longest first</option>
          <option value="duration-asc">Duration &uarr; Shortest first</option>
          <option value="title-custom">Title A&ndash;Z</option>
        </select>
        <input type="search" id="searchHistoryInput" oninput="renderHistory()" placeholder="Search logs by title or details..." class="field" aria-label="Search history">
      </div>
      <div id="historyList"></div>
    </section>

    <section id="tabManual" class="tab" aria-label="Log past hours">
      <form id="manualEntryForm" onsubmit="handleManualSubmit(event)" class="stack">
        <div>
          <label class="lbl" for="manualActivity">Activity</label>
          <input type="text" id="manualActivity" list="activitySuggestions" placeholder="Activity name" required class="field" autocomplete="off">
        </div>
        <div>
          <label class="lbl" for="manualDate">Date</label>
          <input type="date" id="manualDate" required class="field">
        </div>
        <div class="row">
          <div>
            <label class="lbl" for="manualStartTime">Start time</label>
            <input type="time" id="manualStartTime" required class="field">
          </div>
          <div>
            <label class="lbl" for="manualEndTime">End time</label>
            <input type="time" id="manualEndTime" required class="field">
          </div>
        </div>
        <div>
          <label class="lbl" for="manualNotes">Notes / Details</label>
          <textarea id="manualNotes" rows="3" placeholder="Notes / details" class="field"></textarea>
        </div>
        <button type="submit" class="btn">Save entry</button>
      </form>
    </section>

    <datalist id="activitySuggestions"></datalist>
  </main>

  <div id="editModal" class="modal-backdrop" role="dialog" aria-modal="true" aria-labelledby="editModalTitle">
    <div class="modal">
      <div class="modal-head">
        <h2 id="editModalTitle">Edit entry</h2>
        <button class="modal-close" onclick="closeEditModal()" aria-label="Close">&#10005;</button>
      </div>
      <form id="editEntryForm" onsubmit="handleEditSubmit(event)" class="stack">
        <input type="hidden" id="editEntryId">
        <div>
          <label class="lbl" for="editActivity">Activity</label>
          <input type="text" id="editActivity" list="activitySuggestions" required class="field">
        </div>
        <div>
          <label class="lbl" for="editDate">Date</label>
          <input type="date" id="editDate" required class="field">
        </div>
        <div class="row">
          <div>
            <label class="lbl" for="editStartTime">Start time</label>
            <input type="time" id="editStartTime" required class="field">
          </div>
          <div>
            <label class="lbl" for="editEndTime">End time</label>
            <input type="time" id="editEndTime" required class="field">
          </div>
        </div>
        <div>
          <label class="lbl" for="editNotes">Notes</label>
          <textarea id="editNotes" rows="2" class="field"></textarea>
        </div>
        <div class="row">
          <button type="submit" class="btn">Save changes</button>
          <button type="button" onclick="closeEditModal()" class="btn ghost">Cancel</button>
        </div>
      </form>
    </div>
  </div>

  <div id="toast" role="status"></div>
  <input type="file" id="importFileInput" accept=".json" style="display:none" onchange="handleImportFile(event)">
  <script>
    'use strict';

    const OWNER_NAME = 'Shawn Meendering';
    const LS_LOGS = 'cs_service_logs';
    const LS_TIMER = 'cs_timer_state';

    let serviceLogs = [];
    try { serviceLogs = JSON.parse(localStorage.getItem(LS_LOGS) || '[]'); } catch (e) { serviceLogs = []; }
    if (!Array.isArray(serviceLogs)) serviceLogs = [];

    let timerState = { running: false, startTime: null, elapsed: 0, activity: '', notes: '' };
    try { timerState = Object.assign(timerState, JSON.parse(localStorage.getItem(LS_TIMER) || '{}')); } catch (e) {}
    let timerInterval = null;

    function $(id) { return document.getElementById(id); }

    function escapeHtml(str) {
      return String(str).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;').replace(/'/g, '&#039;');
    }

    function showToast(msg) {
      const t = $('toast');
      t.textContent = msg;
      t.classList.add('show');
      clearTimeout(t._timer);
      t._timer = setTimeout(() => t.classList.remove('show'), 2600);
    }

    function downloadFile(content, fileName, contentType) {
      const a = document.createElement('a');
      a.href = URL.createObjectURL(new Blob([content], { type: contentType }));
      a.download = fileName;
      a.click();
      URL.revokeObjectURL(a.href);
    }

    function totalSeconds() {
      return serviceLogs.reduce((acc, i) => acc + (i.durationSeconds || 0), 0);
    }

    // Exact duration display down to the second, e.g. "1:23:45"
    function fmtHMS(sec) {
      sec = Math.max(0, Math.floor(sec || 0));
      const h = Math.floor(sec / 3600);
      const m = Math.floor((sec % 3600) / 60);
      const s = sec % 60;
      return h + ':' + String(m).padStart(2, '0') + ':' + String(s).padStart(2, '0');
    }

    function customCharPriority(ch) {
      if (!ch) return 0;
      const code = ch.charCodeAt(0);
      if (code >= 48 && code <= 57) return 2;
      if (code >= 65 && code <= 90) return 3;
      if (code >= 97 && code <= 122) return 4;
      return 1;
    }
    function compareCustomOrder(a, b) {
      const len = Math.min(a.length, b.length);
      for (let i = 0; i < len; i++) {
        if (a[i] !== b[i]) {
          const pa = customCharPriority(a[i]), pb = customCharPriority(b[i]);
          if (pa !== pb) return pa - pb;
          return a[i].localeCompare(b[i]);
        }
      }
      return a.length - b.length;
    }

    const TAB_IDS = { live: 'tabLive', history: 'tabHistory', manual: 'tabManual' };
    const NAV_IDS = { live: 'navLive', history: 'navHistory', manual: 'navManual' };

    function switchTab(tabKey) {
      Object.keys(TAB_IDS).forEach(k => {
        $(TAB_IDS[k]).classList.toggle('active', k === tabKey);
        $(NAV_IDS[k]).classList.toggle('active', k === tabKey);
      });
      if (timerState.running && tabKey !== 'live') saveTimerState();
    }

    // The data bar slides over the SAME row as the nav: pick an option or close it.
    function toggleDataOverlay(show) {
      $('dataOverlayBar').classList.toggle('open', show);
      $('mainNavBar').classList.toggle('hidden', show);
    }

    function saveLogs() {
      localStorage.setItem(LS_LOGS, JSON.stringify(serviceLogs));
      updateAutocompleteOptions();
    }

    function updateAutocompleteOptions() {
      const titles = [...new Set(serviceLogs.map(l => l.activity))].sort(compareCustomOrder);
      $('activitySuggestions').innerHTML = titles.map(t => `<option value="${escapeHtml(t)}"></option>`).join('');
    }

    function toggleTimer() {
      if (!timerState.running) {
        timerState.running = true;
        timerState.startTime = Date.now() - (timerState.elapsed || 0);
        timerState.activity = $('liveActivity').value;
        timerState.notes = $('liveNotes').value;
        timerInterval = setInterval(updateTimerUI, 1000);
        updateTimerUI();
      } else {
        timerState.running = false;
        clearInterval(timerInterval);
        const finalElapsedSec = Math.floor((Date.now() - timerState.startTime) / 1000);
        const activityName = $('liveActivity').value.trim() || 'General Community Service';
        const notes = $('liveNotes').value.trim();

        if (finalElapsedSec >= 5) {
          const now = new Date();
          const startDate = new Date(Date.now() - finalElapsedSec * 1000);
          serviceLogs.push({
            id: 'log_' + Date.now(),
            activity: activityName,
            date: startDate.toISOString().slice(0, 10),
            startTime: startDate.toTimeString().slice(0, 5),
            endTime: now.toTimeString().slice(0, 5),
            durationSeconds: finalElapsedSec,
            notes: notes
          });
          saveLogs();
          showToast('Session saved: ' + fmtHMS(finalElapsedSec) + ' logged');
        } else {
          showToast('Session under 5 seconds — not saved');
        }
        resetTimer(false);
        switchTab('history');
      }
      saveTimerState();
    }

    function resetTimer(clearForm) {
      timerState = { running: false, startTime: null, elapsed: 0, activity: '', notes: '' };
      clearInterval(timerInterval);
      $('timerDisplay').textContent = '00:00:00';
      if (clearForm !== false) {
        $('liveActivity').value = '';
        $('liveNotes').value = '';
      }
      updateTimerButtonState();
      saveTimerState();
    }

    function saveTimerState() {
      if (timerState.running) {
        timerState.activity = $('liveActivity').value;
        timerState.notes = $('liveNotes').value;
      }
      localStorage.setItem(LS_TIMER, JSON.stringify(timerState));
    }

    function restoreTimerState() {
      if (timerState.running && timerState.startTime) {
        $('liveActivity').value = timerState.activity || '';
        $('liveNotes').value = timerState.notes || '';
        timerInterval = setInterval(updateTimerUI, 1000);
        updateTimerUI();
      }
    }

    function updateTimerUI() {
      if (!timerState.running) return;
      const totalSec = Math.max(0, Math.floor((Date.now() - timerState.startTime) / 1000));
      const h = String(Math.floor(totalSec / 3600)).padStart(2, '0');
      const m = String(Math.floor((totalSec % 3600) / 60)).padStart(2, '0');
      const s = String(totalSec % 60).padStart(2, '0');
      $('timerDisplay').textContent = h + ':' + m + ':' + s;
      saveTimerState();
    }

    function updateTimerButtonState() {
      const btn = $('startTimerBtn'), status = $('timerStatus');
      if (timerState.running) {
        btn.textContent = 'Stop & save session';
        status.textContent = 'Session in progress';
        status.classList.add('running');
      } else {
        btn.textContent = 'Start session';
        status.textContent = 'Ready to start';
        status.classList.remove('running');
      }
    }

    function setDefaultDates() {
      $('manualDate').value = new Date().toISOString().slice(0, 10);
    }

    function computeDuration(date, startTime, endTime) {
      const start = new Date(date + 'T' + startTime);
      const end = new Date(date + 'T' + endTime);
      let sec = Math.floor((end - start) / 1000);
      if (sec < 0) sec += 86400;
      return sec;
    }

    function handleManualSubmit(e) {
      e.preventDefault();
      const date = $('manualDate').value;
      const startTime = $('manualStartTime').value;
      const endTime = $('manualEndTime').value;
      const durationSec = computeDuration(date, startTime, endTime);

      serviceLogs.push({
        id: 'log_' + Date.now(),
        activity: $('manualActivity').value.trim(),
        date: date,
        startTime: startTime,
        endTime: endTime,
        durationSeconds: durationSec,
        notes: $('manualNotes').value.trim()
      });
      saveLogs();

      $('manualActivity').value = '';
      $('manualNotes').value = '';
      $('manualStartTime').value = '';
      $('manualEndTime').value = '';
      setDefaultDates();
      showToast('Entry saved: ' + fmtHMS(durationSec));
      switchTab('history');
    }

    function renderHistory() {
      const container = $('historyList');
      const q = $('searchHistoryInput').value.toLowerCase();
      const sortMode = $('sortOrder').value;
      const total = totalSeconds();

      $('totalHoursDisplay').textContent = fmtHMS(total);
      $('totalHoursSub').textContent = '≈ ' + (total / 3600).toFixed(4) + ' hrs • ' +
        serviceLogs.length + (serviceLogs.length === 1 ? ' session' : ' sessions');

      let filtered = serviceLogs.filter(l =>
        l.activity.toLowerCase().includes(q) || (l.notes && l.notes.toLowerCase().includes(q))
      );
      filtered.sort((a, b) => {
        if (sortMode === 'date-desc') return new Date(b.date + 'T' + b.startTime) - new Date(a.date + 'T' + a.startTime);
        if (sortMode === 'date-asc') return new Date(a.date + 'T' + a.startTime) - new Date(b.date + 'T' + b.startTime);
        if (sortMode === 'duration-desc') return b.durationSeconds - a.durationSeconds;
        if (sortMode === 'duration-asc') return a.durationSeconds - b.durationSeconds;
        if (sortMode === 'title-custom') return compareCustomOrder(a.activity, b.activity);
        return 0;
      });

      if (filtered.length === 0) {
        container.innerHTML = '<div class="empty">No service records found.</div>';
        return;
      }

      container.innerHTML = filtered.map(log => {
        const title = escapeHtml(log.activity);
        return `
          <div class="log-card" style="margin-bottom:14px;">
            <div style="min-width:0;">
              <h3 title="${title}">${title}</h3>
              <div class="meta"><span>${escapeHtml(log.date)}</span><span>${escapeHtml(log.startTime)}&ndash;${escapeHtml(log.endTime)}</span></div>
              <span class="hrs-badge">${fmtHMS(log.durationSeconds || 0)}</span>
              ${log.notes ? `<div class="notes">${escapeHtml(log.notes)}` : ''}
            </div>
            <div class="actions">
              <button onclick="openEditModal('${log.id}')" class="btn ghost small">Edit</button>
              <button onclick="deleteLog('${log.id}')" class="btn ghost small">Delete</button>
            </div>
          </div>`;
      }).join('');
    }

    function deleteLog(id) {
      const log = serviceLogs.find(l => l.id === id);
      if (!log) return;
      if (!confirm('Delete "' + log.activity + '" (' + fmtHMS(log.durationSeconds || 0) + ')?')) return;
      serviceLogs = serviceLogs.filter(l => l.id !== id);
      saveLogs();
      renderHistory();
      showToast('Entry deleted');
    }

    function openEditModal(id) {
      const log = serviceLogs.find(l => l.id === id);
      if (!log) return;
      $('editEntryId').value = log.id;
      $('editActivity').value = log.activity;
      $('editDate').value = log.date;
      $('editStartTime').value = log.startTime;
      $('editEndTime').value = log.endTime;
      $('editNotes').value = log.notes || '';
      $('editModal').classList.add('open');
    }

    function closeEditModal() { $('editModal').classList.remove('open'); }

    function handleEditSubmit(e) {
      e.preventDefault();
      const log = serviceLogs.find(l => l.id === $('editEntryId').value);
      if (!log) return closeEditModal();
      log.activity = $('editActivity').value.trim();
      log.date = $('editDate').value;
      log.startTime = $('editStartTime').value;
      log.endTime = $('editEndTime').value;
      log.notes = $('editNotes').value.trim();
      log.durationSeconds = computeDuration(log.date, log.startTime, log.endTime);
      saveLogs();
      renderHistory();
      closeEditModal();
      showToast('Entry updated');
    }

    function summaryByActivity() {
      const map = {};
      serviceLogs.forEach(l => {
        if (!map[l.activity]) map[l.activity] = { seconds: 0, count: 0 };
        map[l.activity].seconds += (l.durationSeconds || 0);
        map[l.activity].count += 1;
      });
      return Object.keys(map)
        .sort(compareCustomOrder)
        .map(a => ({ activity: a, seconds: map[a].seconds, count: map[a].count }));
    }

    function directExportMarkdown() {
      if (serviceLogs.length === 0) return showToast('No service logs to export yet');
      const total = totalSeconds();

      let md = '# Community Service Log — ' + OWNER_NAME + '\n\n';
      md += '**Total Hours:** ' + fmtHMS(total) + ' (' + (total / 3600).toFixed(4) + ' hrs) across ' + serviceLogs.length + ' session' + (serviceLogs.length === 1 ? '' : 's') + '\n\n';
      md += '## Summary by Activity\n\n';
      summaryByActivity().forEach(s => {
        md += '- **' + s.activity + '** — ' + fmtHMS(s.seconds) + ' (' + (s.seconds / 3600).toFixed(4) + ' hrs, ' + s.count + ' session' + (s.count === 1 ? '' : 's') + ')\n';
      });
      md += '\n## Sessions\n\n';
      [...serviceLogs].sort((a, b) => new Date(b.date + 'T' + b.startTime) - new Date(a.date + 'T' + a.startTime)).forEach(log => {
        md += '### ' + log.activity + '\n';
        md += '- **Date:** ' + log.date + '\n';
        md += '- **Time:** ' + log.startTime + ' – ' + log.endTime + ' (' + fmtHMS(log.durationSeconds || 0) + ', ' + ((log.durationSeconds || 0) / 3600).toFixed(4) + ' hrs)\n';
        if (log.notes) md += '- **Details:** ' + log.notes + '\n';
        md += '\n';
      });
      downloadFile(md, 'community_service_resume.md', 'text/markdown');
      toggleDataOverlay(false);
      showToast('Resume Markdown downloaded');
    }

    function directExportCSV() {
      if (serviceLogs.length === 0) return showToast('No service logs to export yet');
      const esc = v => '"' + String(v || '').replace(/"/g, '""') + '"';
      const rows = [['Activity', 'Date', 'Start', 'End', 'Duration (h:mm:ss)', 'Hours', 'Notes']];
      serviceLogs.forEach(l => rows.push([
        l.activity, l.date, l.startTime, l.endTime,
        fmtHMS(l.durationSeconds || 0), ((l.durationSeconds || 0) / 3600).toFixed(4), l.notes || ''
      ]));
      const csv = rows.map(r => r.map(esc).join(',')).join('\n');
      downloadFile(csv, 'community_service_log.csv', 'text/csv');
      toggleDataOverlay(false);
      showToast('CSV downloaded');
    }

    function directExportJSON() {
      if (serviceLogs.length === 0) return showToast('No service logs to export yet');
      downloadFile(JSON.stringify(serviceLogs, null, 2), 'community_service_backup.json', 'application/json');
      toggleDataOverlay(false);
      showToast('JSON backup downloaded');
    }

    function triggerImportFileDialog() { $('importFileInput').click(); }

    function handleImportFile(event) {
      const file = event.target.files[0];
      event.target.value = '';
      if (!file) return;
      const reader = new FileReader();
      reader.onload = function (e) {
        try {
          const imported = JSON.parse(e.target.result);
          if (Array.isArray(imported)) {
            const existing = new Set(serviceLogs.map(l => l.id));
            const fresh = imported.filter(l => l && l.activity && !existing.has(l.id));
            serviceLogs = serviceLogs.concat(fresh);
            saveLogs();
            renderHistory();
            toggleDataOverlay(false);
            showToast('Imported ' + fresh.length + ' new entr' + (fresh.length === 1 ? 'y' : 'ies') + (fresh.length < imported.length ? ' (' + (imported.length - fresh.length) + ' duplicates skipped)' : ''));
          } else {
            showToast('Invalid backup file format');
          }
        } catch (err) {
          showToast('Error parsing JSON backup file');
        }
      };
      reader.readAsText(file);
    }

    setDefaultDates();
    updateAutocompleteOptions();
    renderHistory();
    restoreTimerState();
    updateTimerButtonState();

    document.addEventListener('keydown', e => {
      if (e.key === 'Escape') closeEditModal();
    });
    $('editModal').addEventListener('click', e => { if (e.target === $('editModal')) closeEditModal(); });

    if ('serviceWorker' in navigator && location.protocol.indexOf('http') === 0) {
      navigator.serviceWorker.register('sw.js').catch(function () {});
    }
  </script>
</body>
</html>
