<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <!-- Transparent Background -->
  
  <!-- Outer Circular Base: Solid Dark Blue Fill & Blue Border -->
  <circle cx="256" cy="256" r="210" fill="#080d1a" stroke="#121e36" stroke-width="20"/>
  
  <!-- Minimalist Clock Hands in Center -->
  <!-- Hour Hand -->
  <line x1="256" y1="256" x2="256" y2="135" stroke="#ffffff" stroke-width="18" stroke-linecap="square"/>
  <!-- Minute Hand -->
  <line x1="256" y1="256" x2="345" y2="256" stroke="#ffffff" stroke-width="14" stroke-linecap="square"/>
  
  <!-- Center Pin -->
  <circle cx="256" cy="256" r="16" fill="#ffffff"/>
</svg>
