<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <!-- Black squircle background, edge-to-edge -->
  <rect x="0" y="0" width="512" height="512" rx="116" fill="#000000"/>
  <rect x="10" y="10" width="492" height="492" rx="108" fill="none" stroke="#121e36" stroke-width="8"/>

  <!-- Minimalist Clock Hands in Center -->
  <line x1="256" y1="256" x2="256" y2="135" stroke="#ffffff" stroke-width="18" stroke-linecap="square"/>
  <line x1="256" y1="256" x2="345" y2="256" stroke="#ffffff" stroke-width="14" stroke-linecap="square"/>
  <circle cx="256" cy="256" r="16" fill="#ffffff"/>
</svg>
